[workspace]
members = [
    "crates/rpg-toolkit-common",
    "crates/rpg-toolkit-renderer",
    "crates/rpg-toolkit-editor",
    "crates/rpg-toolkit-launcher",
    "crates/rpg-toolkit-asset-gen",
    "crates/rpg-toolkit-scenes",
    "tests/properties",
]
resolver = "3"

[workspace.dependencies]
bevy = "0.18"
bevy_egui = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
image = "0.25"
proptest = "1"
