[package]
name = "rpg-toolkit-editor"
version = "0.1.0"
edition = "2024"

[lib]
name = "rpg_toolkit_editor"
path = "src/lib.rs"

[[bin]]
name = "rpg-toolkit-editor"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
bevy_egui = { workspace = true }
rpg-toolkit-common = { path = "../rpg-toolkit-common" }
rpg-toolkit-renderer = { path = "../rpg-toolkit-renderer" }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
uuid = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
zip = { version = "0.6", features = ["deflate"] }
tempfile = "3"

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "editor_value_clamping"
path = "tests/properties/editor_value_clamping.rs"
